[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "var-garch"
version = "1.0.0"
description = "基于GARCH族模型的风险价值（VaR）估计框架（含压力测试）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["finance", "risk", "VaR", "GARCH", "volatility", "stress-testing", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "yfinance>=0.2.40",
    "arch>=6.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["var_garch*"]
